name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # No rustfmt check: the template's code under src/util is kept as given.
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release --lib --bins --test golden
      # The mock venue on localhost: nine fault scenarios against the real binary.
      - run: cargo test --release --test e2e
